name: Atualizar e publicar elementais

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'elementais.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Atualizar catálogo pelo FortniteKing
        run: npm run atualizar

      - name: Validar catálogo
        run: npm run validar

      - name: Salvar catálogo quando houver alteração
        run: |
          if git diff --quiet -- elementais.json; then
            echo "Nenhuma alteração no catálogo."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add elementais.json
            git commit -m "Atualiza disponibilidade dos elementais"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
